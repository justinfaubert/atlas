[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "A workbench for the geometry of meaning: fibre bundles over texts, translations and embedding models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
models = ["sentence-transformers>=2.6", "torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
